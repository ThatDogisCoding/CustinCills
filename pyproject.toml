[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "business-report"
version = "0.1.0"
description = "Weekly business reporting automation for Mindbody, GoHighLevel, and Axle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "email-validator>=2.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
legacy = [
    "openai",
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth-httplib2",
]
full = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "openpyxl>=3.1",
    "rapidfuzz>=3.0",
    "phonenumbers>=8.13",
    "python-dateutil>=2.9",
]
browser = [
    "playwright>=1.40",
]

[project.scripts]
business-report = "business_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
